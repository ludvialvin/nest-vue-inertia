services:
  nestjsvue:
    build:
      context: .
      dockerfile: Dockerfile
    image: nestjsvue:latest
    container_name: nestjsvue
    restart: unless-stopped
    # Jalankan PID 1 sebagai init (handle zombie) & matikan proses Node dengan benar
    init: true
    ports:
      # Binds loopback saja; akses publik disarankan lewat reverse proxy (nginx/caddy).
      # Untuk expose langsung, ganti menjadi "3000:3000".
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Ganti sesuai domain produksi anda (nilai default berasal dari file .env host jika ada)
      APP_URL: ${APP_URL:-https://example.com}
      # Kosongkan jika frontend sama-origin dengan API
      FRONTEND_URL: ${FRONTEND_URL:-}
      # Subdomain lain yang boleh mengakses /api (comma-separated)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Bump saat asset frontend berubah agar Inertia memaksa reload asset
      INERTIA_VERSION: ${INERTIA_VERSION:-prod-1}
      # Percayai X-Forwarded-For dari reverse proxy (untuk IP asli di rate limit)
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Rate limiting global (ttl dalam milidetik)
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      # SSO / OAuth2 (Authorization Code + PKCE)
      SSO_BASE_URL: ${SSO_BASE_URL:-http://localhost:8000}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-http://localhost:3000/auth/callback}
      # JWT lokal untuk sesi (WAJIB ganti di produksi)
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-token}
      TZ: ${TZ:-UTC}
    # Alternatif: baca dari file env (mis. .env.production host)
    # env_file:
    #   - .env.production
    # healthcheck memakai HEALTHCHECK bawaan dari Dockerfile (GET /api/health)